<script>
// Permanent entry point. Reads the current hub address from a public ntfy topic and opens it
// only if it is signed by the PC (ECDSA P-256). The page holds no secrets: only the public key.
const TOPIC = "ladok-ai-hub-be94293f1ab9ded3960f3c6c";
const PUB = {"kty":"EC","crv":"P-256","x":"StPGkUYIHyulDlV_9YKXZR6xFNs-6USl5e560LMzUoQ","y":"QkEI-IFOeJA9cG5B8cB2GbfwC_7KPo1gAQO2lXzJkpI","ext":true};
const RX = /^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/;
const s = document.getElementById('s'), x = document.getElementById('x');
const b64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
function fail(msg){ s.textContent = msg; const last = localStorage.getItem('ladok_hub');
  x.innerHTML = '<a class="btn" href="javascript:location.reload()">Обновить</a>' + (last ? '<br><small>последний адрес: ' + last + '</small>' : ''); }
async function go(){
  try {
    const key = await crypto.subtle.importKey('jwk', PUB, {name:'ECDSA', namedCurve:'P-256'}, false, ['verify']);
    const r = await fetch('https://ntfy.sh/' + TOPIC + '/json?poll=1&since=24h', {cache:'no-store'});
    const lines = (await r.text()).trim().split('\n'); let best = null;
    for (const l of lines) { try {
      const m = JSON.parse(JSON.parse(l).message);
      if (!RX.test(m.url) || !m.ts || !m.sig) continue;
      const ok = await crypto.subtle.verify({name:'ECDSA', hash:'SHA-256'}, key, b64(m.sig), new TextEncoder().encode(m.url + '|' + m.ts));
      if (ok && (!best || m.ts > best.ts)) best = m;
    } catch(e){} }
    if (!best) return fail('ПК сейчас не в сети 😴 Включи ПК и подожди 3–5 минут.');
    localStorage.setItem('ladok_hub', best.url);
    s.textContent = 'Открываю…';
    try { const h = await fetch(best.url + '/health', {cache:'no-store', mode:'no-cors'}); }
    catch(e){ return fail('Хаб отвечает с ошибкой. Похоже, ПК выключен или адрес меняется. Попробуй через 2 минуты.'); }
    location.replace(best.url + '/');
  } catch(e) { fail('Нет связи 📵 Проверь интернет или VPN.'); }
}
go();
